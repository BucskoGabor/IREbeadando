<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <i class="bi bi-book-half login-icon"></i>
      <h1>Könyvtári Rendszer</h1>
      <p>Kölcsönző Nyilvántartás</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      @if (error()) {
        <div class="alert alert-danger alert-sm" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error() }}
        </div>
      }

      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="Felhasználónév"
          [disabled]="loading()"
        />
        <label for="username"><i class="bi bi-person me-2"></i>Felhasználónév</label>
      </div>

      <div class="form-floating mb-4">
        <input
          type="password"
          class="form-control"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Jelszó"
          [disabled]="loading()"
        />
        <label for="password"><i class="bi bi-lock me-2"></i>Jelszó</label>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          Bejelentkezés...
        } @else {
          <i class="bi bi-box-arrow-in-right me-2"></i>Bejelentkezés
        }
      </button>
    </form>
  </div>
</div>
